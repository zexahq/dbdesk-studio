version: 2

# Single bot for dbdesk-studio: Dependabot handles BOTH routine version updates
# and security patches across npm, GitHub Actions, and the Docker base image.
updates:
  # ---- JS/TS dependencies (pnpm workspace) ----------------------------------
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "sunday"
      time: "06:00"
      timezone: "Asia/Kolkata"
    open-pull-requests-limit: 10
    commit-message:
      prefix: "deps"
      include: "scope"
    labels:
      - "dependencies"
    rebase-strategy: "auto"
    groups:
      radix-ui:
        patterns:
          - "@radix-ui/*"
      tanstack:
        patterns:
          - "@tanstack/*"
      monaco:
        patterns:
          - "monaco-*"
          - "@monaco-editor/*"
      dnd-kit:
        patterns:
          - "@dnd-kit/*"
      build-tooling:
        patterns:
          - "vite"
          - "@vitejs/*"
          - "tailwindcss"
          - "@tailwindcss/*"
          - "tsdown"
          - "tsx"
          - "typescript"
          - "eslint*"
          - "prettier*"
          - "turbo"
      react:
        patterns:
          - "react"
          - "react-dom"
          - "@types/react*"
      # Bundle all security patches into a single PR.
      security:
        applies-to: security-updates
        patterns:
          - "*"
    ignore:
      # Disruptive tooling majors — bump manually when ready.
      - dependency-name: "vite"
        update-types: ["version-update:semver-major"]
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]

  # ---- GitHub Actions used in workflows -------------------------------------
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "sunday"
      time: "06:00"
      timezone: "Asia/Kolkata"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps"
      include: "scope"
    labels:
      - "dependencies"
      - "github-actions"
    groups:
      github-actions:
        patterns:
          - "*"

  # ---- Docker base image (Dockerfile) ---------------------------------------
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "sunday"
      time: "06:00"
      timezone: "Asia/Kolkata"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps"
      include: "scope"
    labels:
      - "dependencies"
      - "docker"
